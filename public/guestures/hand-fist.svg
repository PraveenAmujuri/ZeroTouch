<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>ZeroTouch gesture: Hand + Fist</title>
<style>
.fl{animation:bob 3.6s ease-in-out infinite}
.hr .fl{animation-delay:-1.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ex{transform-box:fill-box;transform-origin:50% 100%;animation:rise .7s cubic-bezier(.3,1.5,.5,1) var(--d) both}
@keyframes rise{from{transform:scaleY(.5);opacity:0}to{transform:scaleY(1);opacity:1}}
.cu{transform-box:fill-box;transform-origin:50% 100%;animation:squeeze 2.8s ease-in-out infinite}
@keyframes squeeze{50%{transform:scaleY(.95)}}
.pl{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
